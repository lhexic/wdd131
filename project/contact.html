<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Lhexiverse</title>
  <link rel="stylesheet" href="styles/site_plan.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-logo">Lhexiverse</div>
    <button class="nav-toggle" id="navToggle">☰</button>
    <ul class="nav-menu" id="navMenu">
      <li><a href="siteplan.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <main>
    <h1>Contact Me</h1>
    <form id="contactForm" novalidate>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>
      <span class="error"></span>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
      <span class="error"></span>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>
      <span class="error"></span>

      <button type="submit">Send Message</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Lhexiverse | <a href="references.html">References</a> | Built by Jonathan Kwadjo Azanu</p>
  </footer>
  <script src="scripts/main.js"></script>
</body>
</html>
